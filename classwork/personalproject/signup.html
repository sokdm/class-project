
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wizzyint - Sign Up</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: rgb(112, 65, 190);
            --secondary-color: rgb(90, 130, 230);
            --third-color: rgb(210, 190, 245);
            --text-color: rgb(30, 30, 45);
            --white-color: rgb(255, 255, 255);
            --main-spacing: 20px;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                to right,
                rgb(222, 242, 255),
                rgb(220, 205, 250),
                rgb(235, 220, 255)
            );

            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: var(--white-color);
            padding: 30px;
            border-radius: 15px;
        }

        .logo {
            text-align: center;
            color: var(--primary-color);
            font-size: 30px;
            margin-bottom: var(--main-spacing);
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-color);
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid rgb(200, 200, 210);
            border-radius: 7px;
            font-size: 15px;
        }

        .checkbox-group {
            margin-bottom: 20px;
        }

        .checkbox-group label {
            display: inline;
            font-weight: normal;
        }

        .checkbox-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: rgb(15, 15, 20);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-color);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1 class="logo">Wizzyint.</h1>

        <h2>Create Your Account</h2>

        <p>Join Wizzyint and start learning today.</p>

        <form action="#" method="post">

            <div class="form-group">

                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="number">Phone Number</label>

                <input
                    type="tel"
                    id="number"
                    name="number"
                    placeholder="Enter your phone number"
                    required
                >

            </div>

            <div class="form-group">

                <label for="country">Country</label>

                <select id="country" name="country" required>

                    <option value="">Select your country</option>

                    <option value="Nigeria">Nigeria</option>

                    <option value="Ghana">Ghana</option>

                    <option value="Canada">Canada</option>

                    <option value="United Kingdom">United Kingdom</option>

                    <option value="United States">United States</option>

                    <option value="Other">Other</option>

                </select>

            </div>

            <div class="form-group">

                <label for="date">Date of Birth</label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>

            <div class="checkbox-group">

                <label>Account Category</label>

                <input type="checkbox" id="student" name="category" value="Student">

                <label for="student">Student</label>

                <input type="checkbox" id="graduate" name="category" value="Graduate">

                <label for="graduate">Graduate</label>

            </div>

            <div class="form-group">

                <label for="password">Create Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>

            <button type="submit">Create Account</button>

        </form>

        <div class="footer">

            Already have an account?

            <a href="login.html">Login</a>

        </div>

    </div>

</body>
</html>
