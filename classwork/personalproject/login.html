
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wizzyint - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: rgb(112, 65, 190);
            --secondary-color: rgb(90, 130, 230);
            --text-color: rgb(30, 30, 45);
            --white-color: rgb(255, 255, 255);
            --main-spacing: 20px;
        }

        body {
            font-family: Arial, sans-serif;

            background: linear-gradient(
                to right,
                rgb(222, 242, 255),
                rgb(220, 205, 250),
                rgb(235, 220, 255)
            );

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 400px;
            background-color: var(--white-color);
            padding: 35px;
            border-radius: 15px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            color: var(--primary-color);
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: var(--text-color);
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: gray;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid rgb(200, 200, 210);
            border-radius: 7px;
            font-size: 15px;
        }

        .remember {
            margin-bottom: 20px;
        }

        .remember input {
            width: auto;
        }

        .remember label {
            display: inline;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: rgb(15, 15, 20);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-color);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1 class="logo">Wizzyint.</h1>

        <h2>Welcome Back!</h2>

        <p>Login to continue your learning journey.</p>

        <form action="#" method="post">

            <div class="form-group">

                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <div class="remember">

                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                >

                <label for="remember">Keep me logged in</label>

            </div>

            <button type="submit">Login</button>

        </form>

        <div class="footer">

            Don't have an account?

            <a href="signup.html">Create Account</a>

        </div>

    </div>

</body>
</html>
